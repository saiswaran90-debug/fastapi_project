<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details — Student Management System</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f7ff;
            color: #334155;
            min-height: 100vh;
        }

        nav {
            background: #ffffff;
            box-shadow: 0 2px 12px rgba(99, 102, 241, 0.08);
            padding: 16px 40px;
            display: flex; align-items: center;
            justify-content: space-between;
            flex-wrap: wrap; gap: 14px;
            position: sticky; top: 0; z-index: 10;
        }

        nav .brand { font-size: 20px; font-weight: 700; color: #4338ca; }

        nav ul { list-style: none; display: flex; gap: 8px; flex-wrap: wrap; }

        nav ul li a {
            text-decoration: none; color: #475569;
            font-weight: 600; font-size: 14px;
            padding: 9px 18px; border-radius: 25px;
            transition: 0.25s;
        }

        nav ul li a:hover { background: #eef2ff; color: #4338ca; }

        nav ul li a.active {
            background: linear-gradient(135deg, #a5b4fc, #c4b5fd);
            color: #312e81;
        }

        .wrap { padding: 50px 15px; display: flex; justify-content: center; }

        .card {
            width: 100%; max-width: 460px;
            background: #ffffff; padding: 34px 30px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.10);
            border: 1px solid #eef2ff;
            text-align: center;
        }

        .card img {
            width: 120px; height: 120px;
            border-radius: 50%; object-fit: cover;
            border: 5px solid #e0e7ff;
            margin-bottom: 18px; background: #eef2ff;
        }

        .card h1 { color: #3730a3; font-size: 24px; margin-bottom: 6px; }

        .card .sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }

        .row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; margin-bottom: 10px;
            background: #f8faff; border-radius: 10px;
            font-size: 15px;
        }

        .row .label { color: #818cf8; font-weight: 600; }
        .row .value { color: #334155; font-weight: 500; }

        .present {
            background: #d1fae5 !important;
            color: #047857 !important;
            font-weight: 700;
        }

        .absent {
            background: #fee2e2 !important;
            color: #b91c1c !important;
            font-weight: 700;
        }

        .back {
            display: block; width: 100%; padding: 12px;
            margin-top: 22px;
            background: linear-gradient(135deg, #a5b4fc, #c4b5fd);
            color: #312e81; text-decoration: none;
            border-radius: 10px; font-weight: 700;
            transition: 0.3s;
        }

        .back:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(165, 180, 252, 0.5);
        }

        @media (max-width: 600px) {
            nav { padding: 14px 18px; }
            .card { padding: 26px 20px; }
        }
    </style>
</head>

<body>

    <nav>
        <div class="brand">Student Management System</div>
        <ul>
            <li><a href="/" class="active">Home</a></li>
            <li><a href="/students/add">Add Student</a></li>
        </ul>
    </nav>

    <div class="wrap">

        <div class="card">

            <img src="{{ std[5] }}" alt="{{ std[1] }}">

            <h1>{{ std[1] }}</h1>
            <p class="sub">Student ID: {{ std[0] }}</p>

            <div class="row">
                <span class="label">Age</span>
                <span class="value">{{ std[2] }}</span>
            </div>

            <div class="row">
                <span class="label">Course</span>
                <span class="value">{{ std[3] }}</span>
            </div>

            <div class="row">
                <span class="label">Marks</span>
                <span class="value">{{ std[4] }}</span>
            </div>

            <div class="row">
                <span class="label">Gender</span>
                <span class="value">{{ std[6] }}</span>
            </div>

            {% if std[7] == 1 %}
                <div class="row present">
                    <span>Attendance</span>
                    <span>Present</span>
                </div>
            {% else %}
                <div class="row absent">
                    <span>Attendance</span>
                    <span>Absent</span>
                </div>
            {% endif %}

            <a href="/" class="back">← Back to Home</a>

        </div>

    </div>

</body>
</html>
